{% extends 'tph_system/base.html' %}
{% block content %}

<div class="container cont_store">
    <div class="card shadow" id="upd_del_forms">
        <div class="card-header">
            <h4 class="card-title">{{ card_title|default:"Удаление отчёта" }}</h4>
        </div>

        <div class="card-body">
            <form method="post" class="form-control">
                {% csrf_token %}
                Подтверждаете удаление отчёта по точке <b>{{ reportupload.location }}</b>
                за <i>{{ reportupload.report_date }}</i>? Исходное фото будет удалено безвозвратно.<br>
                <br>
                <button class="btn btn-danger" type="submit">Удалить</button>
                <a class="btn btn-warning" href="{% url 'report_ocr:detail' reportupload.id %}?{{ current_filter_params }}" role="button">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
